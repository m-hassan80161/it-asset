name: CD - ITAM Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux, x64]

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # Create Production Environment
      # ==========================================
      - name: Create Production .env
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          PGADMIN_EMAIL=${PGADMIN_EMAIL}
          PGADMIN_PASSWORD=${PGADMIN_PASSWORD}
          IMAGE_TAG=latest
          EOF

          chmod 600 .env

      # ==========================================
      # Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # Cache Docker Images (GitHub Actions Cache)
      # ==========================================
      - name: Cache Docker Images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('docker-compose.prod.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # ==========================================
      # Load Cached Images (If exists)
      # ==========================================
      - name: Load Cached Docker Images
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          echo "Loading cached images..."
          for image in /tmp/docker-cache/*.tar; do
            if [ -f "$image" ]; then
              docker load -i "$image"
            fi
          done

      # ==========================================
      # Pull Production Images
      # ==========================================
      - name: Pull Production Images
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            pull

      # ==========================================
      # Save Updated Images to Cache
      # ==========================================
      - name: Save Docker Images to Cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          images=$(docker compose -f docker-compose.prod.yml config | grep 'image:' | awk '{print $2}' | sort -u)
          for img in $images; do
            filename=$(echo "$img" | tr '/:' '_').tar
            echo "Saving $img to /tmp/docker-cache/$filename"
            docker save "$img" -o "/tmp/docker-cache/$filename" || true
          done

      # ==========================================
      # Start PostgreSQL
      # ==========================================
      - name: Start PostgreSQL
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            up -d postgres

      # ==========================================
      # Wait for PostgreSQL
      # ==========================================
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do
            if docker inspect \
              --format='{{.State.Health.Status}}' \
              itam_postgres 2>/dev/null | grep -q healthy
            then
              echo "PostgreSQL is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL failed health check"
          docker logs itam_postgres
          exit 1

      # ==========================================
      # Run Prisma Migrations
      # ==========================================
      - name: Run Database Migrations
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            run --rm backend \
            npx prisma migrate deploy --schema=prisma/schema.prisma

      # ==========================================
      # Start Application
      # ==========================================
      - name: Start Application
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            up -d

      # ==========================================
      # Check Containers
      # ==========================================
      - name: Check Deployment
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            ps