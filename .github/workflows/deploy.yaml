name: CD - ITAM Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux, x64]

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # Create Production Environment
      # ==========================================
      - name: Create Production .env
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          PGADMIN_EMAIL=${PGADMIN_EMAIL}
          PGADMIN_PASSWORD=${PGADMIN_PASSWORD}
          IMAGE_TAG=latest
          EOF

          chmod 600 .env

      # ==========================================
      # Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # Pull Images
      # ==========================================
      - name: Pull Production Images
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            pull

      # ==========================================
      # Start PostgreSQL
      # ==========================================
      - name: Start PostgreSQL
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            up -d postgres

      # ==========================================
      # Wait for PostgreSQL
      # ==========================================
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be healthy..."
          
          for i in {1..30}; do
            if docker inspect \
              --format='{{.State.Health.Status}}' \
              itam_postgres 2>/dev/null | grep -q healthy
            then
              echo "✅ PostgreSQL is healthy"
              exit 0
            fi
            
            echo "Attempt $i/30... waiting..."
            sleep 2
          done
          
          echo "❌ PostgreSQL failed health check"
          docker logs itam_postgres
          exit 1

      # ==========================================
      # Start Backend
      # ==========================================
      - name: Start Backend Service
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            up -d backend

      # ==========================================
      # Wait for Backend to be ready
      # ==========================================
      - name: Wait for Backend Container
        run: |
          echo "Waiting for backend container to be ready..."
          
          for i in {1..20}; do
            if docker inspect \
              --format='{{.State.Running}}' \
              itam_backend 2>/dev/null | grep -q true
            then
              echo "✅ Backend container is running"
              sleep 2
              exit 0
            fi
            
            echo "Attempt $i/20... waiting..."
            sleep 1
          done
          
          echo "❌ Backend container failed to start"
          docker logs itam_backend
          exit 1

      # ==========================================
      # Run Prisma Migrations (للـ schema updates)
      # ==========================================
      - name: Run Prisma Migrations
        run: |
          echo "Running Prisma migrations..."
          
          docker compose \
            -f docker-compose.prod.yml \
            exec -T backend \
            npx prisma migrate deploy
          
          if [ $? -eq 0 ]; then
            echo "✅ Migrations completed successfully"
          else
            echo "❌ Migrations failed"
            exit 1
          fi

      # ==========================================
      # Start All Services
      # ==========================================
      - name: Start All Services
        run: |
          echo "Starting all services..."
          
          docker compose \
            -f docker-compose.prod.yml \
            up -d
          
          echo "✅ All services started"

      # ==========================================
      # Check Deployment
      # ==========================================
      - name: Check Deployment Status
        run: |
          echo "Checking deployment status..."
          
          docker compose \
            -f docker-compose.prod.yml \
            ps
          
          echo "Waiting for services to stabilize..."
          sleep 5
          
          # Check backend health
          if docker compose \
            -f docker-compose.prod.yml \
            exec -T backend curl -f http://localhost:3000/api/health 2>/dev/null
          then
            echo "✅ Backend is healthy"
          else
            echo "⚠️ Backend might still be initializing"
          fi

      # ==========================================
      # Show Logs (عند الفشل)
      # ==========================================
      - name: Show Deployment Logs
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.prod.yml logs backend --tail=50
          
          echo -e "\n=== Database Logs ==="
          docker compose -f docker-compose.prod.yml logs postgres --tail=50
          
          echo -e "\n=== Frontend Logs ==="
          docker compose -f docker-compose.prod.yml logs frontend --tail=50

      # ==========================================
      # Notify Success
      # ==========================================
      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Backend: http://localhost:3000"
          echo "Frontend: http://localhost"