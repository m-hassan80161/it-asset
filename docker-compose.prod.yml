services:

  postgres:
    image: YOUR_DOCKERHUB_USERNAME/itam-postgres:16
    container_name: itam_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - itam_net


  backend:
    image: YOUR_DOCKERHUB_USERNAME/itam-backend:${IMAGE_TAG}
    container_name: itam_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    networks:
      - itam_net


  frontend:
    image: YOUR_DOCKERHUB_USERNAME/itam-frontend:${IMAGE_TAG}
    container_name: itam_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    networks:
      - itam_net


  nginx:
    image: nginx:alpine
    container_name: itam_proxy
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - itam_net


networks:
  itam_net:
    driver: bridge


volumes:
  postgres_data:
    name: itam_postgres_data