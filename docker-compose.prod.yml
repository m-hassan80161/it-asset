services:

  postgres:
    image: postgres:16
    container_name: itam_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - itam_net


  backend:
    image: ${DOCKERHUB_USERNAME}/itam-backend:${IMAGE_TAG}
    container_name: itam_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the deployment environment}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NODE_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost:8443}
      AGENT_UPDATE_PUBLIC_KEY: ${AGENT_UPDATE_PUBLIC_KEY:-}
      AGENT_RELEASES_DIR: /data/agent-releases

    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - agent_release_data:/data/agent-releases

    networks:
      - itam_net


  frontend:
    image: ${DOCKERHUB_USERNAME}/itam-frontend:${IMAGE_TAG}
    container_name: itam_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    networks:
      - itam_net


  nginx:
    image: ${DOCKERHUB_USERNAME}/itam-nginx:${IMAGE_TAG}
    container_name: itam_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - frontend
      - backend

    volumes:
      - ./nginx/production.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    networks:
      - itam_net


networks:
  itam_net:
    driver: bridge


volumes:
  postgres_data:
    name: itam_postgres_data
  agent_release_data:
    name: itam_agent_release_data

