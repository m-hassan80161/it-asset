services:
  postgres:
    image: postgres:16-alpine
    container_name: itam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itam_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-itam_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itam_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itam_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itam_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-itam_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-itam_platform}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - itam_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "api/v1"
    container_name: itam_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - itam_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: itam_pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    ports:
      - "5050:80"
    networks:
      - itam_net
    profiles:
      - tools   # start with: docker compose --profile tools up
  nginx:
    image: nginx:alpine
    container_name: itam_proxy
    ports:
      - "8080:80"
    volumes:
      # 🔴 استخدام المسار النسبي بوجود النقطة ./
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
    networks:
      - itam_net
    depends_on:
      - frontend
      - backend

networks:
  itam_net:
    driver: bridge

volumes:
  postgres_data:
